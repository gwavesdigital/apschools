<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>Share · AP Schools</title>

  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
    <img src="../assets/emblem.png" class="bg-watermark" alt="" />
  </div>

  <div class="app">
    <section class="screen screen-share">

      <div class="share-body">

        <div class="share-check">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="8 12 11 15 16 10"/>
          </svg>
        </div>

        <h1 class="share-title">Saved Successfully</h1>
        <p class="share-sub">Now share with Principal:</p>

        <button class="btn btn-whatsapp btn-xl btn-block" id="btnWhatsapp">
          <svg viewBox="0 0 32 32" width="22" height="22">
            <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
          </svg>
          <span>Share to WhatsApp</span>
        </button>

        <button class="btn btn-primary btn-xl btn-block" id="btnDownloadPng">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Download PNG Poster</span>
        </button>

        <div class="share-divider">
          <span>or</span>
        </div>

        <a href="./teacher.html" class="btn btn-outline btn-block">← Back to Dashboard</a>

      </div>

      <footer class="app-footer">
        <div class="footer-initiative">
          An initiative of <strong>@VALIASS</strong> team
        </div>
        <div class="footer-contacts">
          <a href="tel:+918985361991" class="footer-contact-btn footer-phone" aria-label="Call Valiass">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
            </svg>
          </a>
          <a href="https://wa.me/918985361991" class="footer-contact-btn footer-wa" target="_blank" rel="noopener" aria-label="WhatsApp Valiass">
            <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
              <path fill="#25D366" d="M16 .5C7.4.5.5 7.4.5 16c0 2.8.7 5.4 2 7.7L.5 31.5l8-2.1c2.2 1.2 4.8 1.9 7.5 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.5 16 .5z"/>
              <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
            </svg>
          </a>
        </div>
      </footer>

    </section>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById('btnWhatsapp').addEventListener('click', () => {
      const s = JSON.parse(localStorage.getItem('ap_device_setup') || '{}');
      const text = encodeURIComponent(
        `Respected Sir,\n\nPlease find the attached report.\n\nSchool: ${s.schoolName || ''}, ${s.village || ''}\n— Team ${s.schoolName || ''}\n\nSent via AP Schools E-Diary App`
      );
      window.open(`https://wa.me/?text=${text}`, '_blank');
    });

    document.getElementById('btnDownloadPng').addEventListener('click', () => {
      showToast('PNG download will be enabled soon');
    });
  </script>
</body>
</html>
