<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>Teacher Dashboard · AP Schools</title>

  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
    <img src="../assets/emblem.png" class="bg-watermark" alt="" />
  </div>

  <div class="app">
    <section class="screen screen-dashboard">

      <header class="topbar">
        <a href="./roles.html" class="topbar-back" aria-label="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="topbar-title" id="dashTitle">Teacher</div>
        <a href="./settings.html" class="topbar-back" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
      </header>

      <div class="dash-body">

        <!-- Greeting -->
        <div class="dash-greet">
          <div class="dash-greet-title">Good day, Teacher 👋</div>
          <div class="dash-greet-sub" id="dashGreetSub">Dagguluru · Today</div>
        </div>

        <!-- Quick Actions -->
        <div class="section-title">Quick Actions</div>
        <div class="quick-actions">
          <a href="./ediary.html" class="action-card action-ediary">
            <div class="action-icon">📔</div>
            <div class="action-title">E-Diary</div>
            <div class="action-sub">Fill daily notes</div>
          </a>
          <a href="./announce.html" class="action-card action-announce">
            <div class="action-icon">📢</div>
            <div class="action-title">Announce</div>
            <div class="action-sub">Send notice</div>
          </a>
        </div>

        <!-- History -->
        <div class="section-title">My History</div>
        <button class="list-row" data-history="ediary">
          <span class="list-row-label">📂 Submitted E-Diary</span>
          <span class="list-row-right">
            <span class="row-count" id="countEdiary">0</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
        </button>
        <button class="list-row" data-history="announce">
          <span class="list-row-label">📂 Submitted Announcements</span>
          <span class="list-row-right">
            <span class="row-count" id="countAnnounce">0</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </span
