<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>Announcement · AP Schools</title>

  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
    <img src="../assets/emblem.png" class="bg-watermark" alt="" />
  </div>

  <div class="app">
    <section class="screen screen-form">

      <header class="topbar">
        <a href="./teacher.html" class="topbar-back" aria-label="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="topbar-title">Announcement</div>
        <div class="topbar-spacer"></div>
      </header>

      <div class="setup-body">

        <div class="form-header-premium">
          <img src="../assets/emblem.png" alt="Emblem" class="form-premium-emblem" />
          <div class="form-premium-info">
            <div class="form-premium-school" id="fmSchool">AP Primary School</div>
            <div class="form-premium-sub" id="fmSub">Dagguluru · West Godavari</div>
          </div>
        </div>

        <form class="setup-form" id="announceForm" autocomplete="off">

          <div class="form-section">
            <div class="form-section-head">
              <span class="form-section-dot"></span>
              <span class="form-section-label">Basic Info</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="announceTeacher">Teacher Name <span class="form-required">*</span></label>
              <input type="text" class="form-input" id="announceTeacher" placeholder="Your name" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="announceDate">Date <span class="form-required">*</span></label>
              <input type="date" class="form-input" id="announceDate" data-today required />
            </div>

            <div class="form-group">
              <label class="form-label">Type <span class="form-required">*</span></label>
              <div class="radio-row">
                <label class="radio">
                  <input type="radio" name="announceType" value="school" checked />
                  <span>School-wide</span>
                </label>
                <label class="radio">
                  <input type="radio" name="announceType" value="class" />
                  <span>Class-specific</span>
                </label>
              </div>
            </div>

            <div class="form-group" id="announceClassGroup" hidden>
              <label class="form-label" for="announceClass">Class</label>
              <div class="form-input-wrap">
                <select class="form-input form-select" id="announceClass">
                  <option value="">Select class</option>
                  <option value="1">I</option>
                  <option value="2">II</option>
                  <option value="3">III</option>
                  <option value="4">IV</option>
                  <option value="5">V</option>
                  <option value="6">VI</option>
                  <option value="7">VII</option>
                  <option value="8">VIII</option>
                  <option value="9">IX</option>
                  <option value="10">X</option>
                </select>
                <svg class="form-select-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </div>
            </div>
          </div>

          <div class="form-section">
            <div class="form-section-head">
              <span class="form-section-dot"></span>
              <span class="form-section-label">Message</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="announceTitle">Title <span class="form-required">*</span></label>
              <input type="text" class="form-input" id="announceTitle" placeholder="e.g. Holiday Notice" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="announceDetails">Details <span class="form-required">*</span></label>
              <textarea class="form-input" id="announceDetails" rows="5" placeholder="Full message…" required></textarea>
            </div>
          </div>

          <div class="form-actions form-actions-stack">
            <a href="./review.html?type=announce" class="btn btn-primary btn-xl btn-block">
              <span>Review &amp; Continue</span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </a>
            <button type="button" class="btn btn-outline btn-block" id="btnSaveDraft">Save Draft</button>
          </div>

        </form>

      </div>

      <footer class="app-footer">
        <div class="footer-initiative">
          An initiative of <strong>@VALIASS</strong> team
        </div>
        <div class="footer-contacts">
          <a href="tel:+918985361991" class="footer-contact-btn footer-phone" aria-label="Call Valiass">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
            </svg>
          </a>
          <a href="https://wa.me/918985361991" class="footer-contact-btn footer-wa" target="_blank" rel="noopener" aria-label="WhatsApp Valiass">
            <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
              <path fill="#25D366" d="M16 .5C7.4.5.5 7.4.5 16c0 2.8.7 5.4 2 7.7L.5 31.5l8-2.1c2.2 1.2 4.8 1.9 7.5 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.5 16 .5z"/>
              <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
            </svg>
          </a>
        </div>
      </footer>

    </section>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const s = JSON.parse(localStorage.getItem('ap_device_setup') || 'null');
        if (s) {
          document.getElementById('fmSchool').textContent = s.schoolName || 'School';
          document.getElementById('fmSub').textContent = `${s.village || ''} · ${s.district || ''}`;
        }
      } catch (e) {}

      document.querySelectorAll('input[name="announceType"]').forEach(r => {
        r.addEventListener('change', () => {
          const group = document.getElementById('announceClassGroup');
          const isClass = document.querySelector('input[name="announceType"]:checked').value === 'class';
          group.hidden = !isClass;
        });
      });
    });

    document.getElementById('btnSaveDraft').addEventListener('click', () => {
      showToast('Draft saved locally');
    });
  </script>
</body>
</html>
