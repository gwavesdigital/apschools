<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>Reset Password · AP Schools</title>

  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
    <img src="../assets/emblem.png" class="bg-watermark" alt="" />
  </div>

  <div class="app">
    <section class="screen screen-forgot">

      <header class="topbar">
        <a href="./login.html" class="topbar-back" aria-label="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="topbar-title">Reset Password</div>
        <div class="topbar-spacer"></div>
      </header>

      <div class="activation-body">

        <div class="activation-hero">
          <div class="activation-icon" style="background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
          </div>
          <h1 class="activation-title">Reset Your Password</h1>
          <p class="activation-sub">
            Enter the School Secret Code provided<br />by Team Valiass to reset
          </p>
        </div>

        <form class="activation-card" id="forgotForm" autocomplete="off" novalidate>

          <div class="form-group">
            <label class="form-label" for="forgotCode">School Secret Code</label>
            <input
              type="text"
              class="form-input form-input-code"
              id="forgotCode"
              placeholder="xxxxxx@533340"
              spellcheck="false"
              maxlength="13"
              required
            />
          </div>

          <div class="activation-attempts" id="attemptsBar">
            <span class="attempts-dot" data-attempt="1"></span>
            <span class="attempts-dot" data-attempt="2"></span>
            <span class="attempts-dot" data-attempt="3"></span>
            <span class="attempts-text" id="attemptsText">3 attempts left</span>
          </div>

          <p class="activation-error" id="forgotError" hidden></p>

          <button type="submit" class="btn btn-primary btn-xl btn-block" id="btnVerify">
            <span>Verify Code</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>

        </form>

        <div class="activation-lock" id="lockoutCard" hidden>
          <div class="activation-lock-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <h3 class="activation-lock-title">Device Temporarily Locked</h3>
          <p class="activation-lock-sub">Too many incorrect attempts.</p>
          <div class="activation-lock-time">
            <span class="lock-label">Try again in</span>
            <span class="lock-countdown" id="lockCountdown">1:00</span>
          </div>
        </div>

        <div class="activation-help">
          <div class="activation-help-title">
            <span class="help-dot"></span>
            <span>Don't have the code?</span>
          </div>
          <p class="activation-help-text">Contact Team Valiass to receive it.</p>
          <div class="activation-help-actions">
            <a href="tel:+918985361991" class="btn btn-outline btn-help">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
              </svg>
              <span>Call</span>
            </a>
            <a href="https://wa.me/918985361991" target="_blank" rel="noopener" class="btn btn-whatsapp btn-help">
              <svg viewBox="0 0 32 32" width="16" height="16">
                <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
              </svg>
              <span>WhatsApp</span>
            </a>
          </div>
        </div>

      </div>

      <footer class="app-footer">
        <div class="footer-initiative">
          An initiative of <strong>@VALIASS</strong> team
        </div>
        <div class="footer-contacts">
          <a href="tel:+918985361991" class="footer-contact-btn footer-phone" aria-label="Call Valiass">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
            </svg>
          </a>
          <a href="https://wa.me/918985361991" class="footer-contact-btn footer-wa" target="_blank" rel="noopener" aria-label="WhatsApp Valiass">
            <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
              <path fill="#25D366" d="M16 .5C7.4.5.5 7.4.5 16c0 2.8.7 5.4 2 7.7L.5 31.5l8-2.1c2.2 1.2 4.8 1.9 7.5 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.5 16 .5z"/>
              <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
            </svg>
          </a>
        </div>
      </footer>

    </section>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form         = document.getElementById('forgotForm');
      const input        = document.getElementById('forgotCode');
      const errorEl      = document.getElementById('forgotError');
      const btnVerify    = document.getElementById('btnVerify');
      const attemptsText = document.getElementById('attemptsText');
      const attemptsDots = document.querySelectorAll('#attemptsBar .attempts-dot');
      const lockoutCard  = document.getElementById('lockoutCard');
      const countdown    = document.getElementById('lockCountdown');

      const MAX = 3, LOCK = 60;
      let attempts = parseInt(localStorage.getItem('ap_forgot_attempts') || '0', 10);
      let lockUntil = parseInt(localStorage.getItem('ap_forgot_lockUntil') || '0', 10);

      input.addEventListener('input', (e) => {
        let v = e.target.value.replace(/[^a-z0-9@]/gi, '').toLowerCase();
        if (!v.includes('@') && v.length > 6) v = v.slice(0, 6) + '@' + v.slice(6);
        e.target.value = v;
      });

      if (lockUntil > Date.now()) {
        startLockout(Math.ceil((lockUntil - Date.now()) / 1000));
      } else {
        if (lockUntil && lockUntil <= Date.now()) {
          attempts = 0; lockUntil = 0;
          localStorage.setItem('ap_forgot_attempts', '0');
          localStorage.setItem('ap_forgot_lockUntil', '0');
        }
        updateUI();
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (lockUntil > Date.now()) return;

        const entered = (input.value || '').trim().toLowerCase();
        const expected = (localStorage.getItem('ap_school_secret') || '').toLowerCase();

        if (!entered) { showErr('Please enter the code'); return; }
        if (!expected) { showErr('Setup missing'); return; }

        if (entered === expected) {
          localStorage.setItem('ap_reset_authorized', 'true');
          showToast('Verified ✅');
          btnVerify.disabled = true;
          btnVerify.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8"><polyline points="20 6 9 17 4 12"/></svg> <span>Verified</span>`;
          setTimeout(() => window.location.href = './create-password.html?mode=reset', 800);
        } else {
          attempts++;
          localStorage.setItem('ap_forgot_attempts', String(attempts));
          const remaining = MAX - attempts;
          if (remaining <= 0) {
            lockUntil = Date.now() + LOCK * 1000;
            localStorage.setItem('ap_forgot_lockUntil', String(lockUntil));
            startLockout(LOCK);
          } else {
            showErr(`Incorrect code. ${remaining} attempt${remaining === 1 ? '' : 's'} left.`);
            updateUI();
            input.select();
          }
        }
      });

      function updateUI() {
        const r = MAX - attempts;
        attemptsText.textContent = `${r} attempt${r === 1 ? '' : 's'} left`;
        attemptsDots.forEach((d, i) => d.classList.toggle('used', i >= r));
      }

      function startLockout(sec) {
        document.querySelector('.activation-card').style.display = 'none';
        lockoutCard.hidden = false;
        let r = sec; render(r);
        const iv = setInterval(() => {
          r--; render(r);
          if (r <= 0) {
            clearInterval(iv);
            attempts = 0; lockUntil = 0;
            localStorage.setItem('ap_forgot_attempts', '0');
            localStorage.setItem('ap_forgot_lockUntil', '0');
            document.querySelector('.activation-card').style.display = '';
            lockoutCard.hidden = true;
            input.value = ''; btnVerify.disabled = false;
            document.getElementById('forgotError').hidden = true;
            updateUI(); input.focus();
          }
        }, 1000);
      }

      function render(s) {
        const m = Math.floor(s / 60), ss = String(s % 60).padStart(2, '0');
        countdown.textContent = `${m}:${ss}`;
      }

      function showErr(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
        input.classList.add('input-error');
      }

      input.addEventListener('input', () => {
        errorEl.hidden = true;
        input.classList.remove('input-error');
      });
    });
  </script>
</body>
</html>
