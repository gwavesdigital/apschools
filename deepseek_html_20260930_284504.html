<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>Device Setup · AP Schools</title>

  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style.css" />
</head>

<body>

  <!-- Background -->
  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
    <img src="../assets/emblem.png" class="bg-watermark" alt="" />
  </div>

  <!-- App -->
  <div class="app">
    <section class="screen screen-setup">

      <!-- Top Bar -->
      <header class="topbar">
        <a href="../index.html" class="topbar-back" aria-label="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="topbar-title">Device Setup</div>
        <div class="topbar-spacer"></div>
      </header>

      <!-- Body -->
      <div class="setup-body">

        <!-- Intro Card -->
        <div class="setup-intro">
          <div class="setup-intro-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>
          <div class="setup-intro-text">
            <h2>Set Up Your School</h2>
            <p>Fill in the details once. You can edit them anytime in Settings.</p>
          </div>
        </div>

        <!-- Form -->
        <form class="setup-form" id="setupForm" autocomplete="off">

          <!-- Section: Location -->
          <div class="form-section">
            <div class="form-section-head">
              <span class="form-section-dot"></span>
              <span class="form-section-label">Location</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="setupDistrict">
                District <span class="form-required">*</span>
              </label>
              <div class="form-input-wrap">
                <select class="form-input form-select" id="setupDistrict" required>
                  <option value="">Select district</option>
                </select>
                <svg class="form-select-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="setupMandal">
                Mandal <span class="form-required">*</span>
              </label>
              <input
                type="text"
                class="form-input"
                id="setupMandal"
                placeholder="e.g. Dagguluru"
                required
              />
            </div>
          </div>

          <!-- Section: School -->
          <div class="form-section">
            <div class="form-section-head">
              <span class="form-section-dot"></span>
              <span class="form-section-label">School</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="setupSchoolName">
                School Name <span class="form-required">*</span>
              </label>
              <input
                type="text"
                class="form-input"
                id="setupSchoolName"
                placeholder="e.g. AP Primary School"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="setupVillage">
                Village <span class="form-required">*</span>
              </label>
              <input
                type="text"
                class="form-input"
                id="setupVillage"
                placeholder="e.g. Dagguluru"
                required
              />
            </div>
          </div>

          <!-- Section: Officers -->
          <div class="form-section">
            <div class="form-section-head">
              <span class="form-section-dot"></span>
              <span class="form-section-label">Officers</span>
              <span class="form-section-hint">Shown in report footer</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="setupDeoName">DEO Name</label>
              <input
                type="text"
                class="form-input"
                id="setupDeoName"
                placeholder="e.g. Sri. K. Ramakrishna"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="setupMandalOfficer">Mandal Officer Name</label>
              <input
                type="text"
                class="form-input"
                id="setupMandalOfficer"
                placeholder="e.g. Sri. P. Venkatesh"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="setupPrincipalName">Principal Name</label>
              <input
                type="text"
                class="form-input"
                id="setupPrincipalName"
                placeholder="e.g. Sri K. V. Rao"
              />
            </div>
          </div>

          <!-- Actions -->
          <div class="form-actions form-actions-stack">
            <button type="submit" class="btn btn-primary btn-xl">
              <span>Save &amp; Continue</span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
            <button type="button" class="btn btn-outline" id="btnSetupReset">Reset</button>
          </div>

        </form>

      </div>

      <!-- Footer -->
      <footer class="app-footer">
        <div class="footer-initiative">
          An initiative of <strong>@VALIASS</strong> team
        </div>
        <div class="footer-contacts">
          <a href="tel:+918985361991" class="footer-contact-btn footer-phone" aria-label="Call Valiass">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
            </svg>
          </a>
          <a href="https://wa.me/918985361991" class="footer-contact-btn footer-wa" target="_blank" rel="noopener" aria-label="WhatsApp Valiass">
            <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
              <path fill="#25D366" d="M16 .5C7.4.5.5 7.4.5 16c0 2.8.7 5.4 2 7.7L.5 31.5l8-2.1c2.2 1.2 4.8 1.9 7.5 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.5 16 .5z"/>
              <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
            </svg>
          </a>
        </div>
      </footer>

    </section>
  </div>

  <!-- Scripts -->
  <script src="../js/app.js"></script>
  <script>
    /* ── Setup page logic ── */
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('setupForm');
      const btnReset = document.getElementById('btnSetupReset');
      const selectDistrict = document.getElementById('setupDistrict');

      /* Load districts */
      fetch('../data/districts.json')
        .then(r => r.json())
        .then(districts => {
          districts.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            selectDistrict.appendChild(opt);
          });
        })
        .catch(() => {
          const fallback = [
            'Anantapur', 'Chittoor', 'East Godavari', 'Guntur', 'Krishna',
            'Kurnool', 'Nellore', 'Prakasam', 'Srikakulam', 'Visakhapatnam',
            'Vizianagaram', 'West Godavari', 'Kadapa', 'Tirupati',
            'NTR', 'Eluru', 'Kakinada', 'Konaseema', 'Palnadu', 'Bapatla'
          ];
          fallback.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            opt.textContent = d;
            selectDistrict.appendChild(opt);
          });
        });

      /* Reset */
      btnReset.addEventListener('click', () => {
        form.reset();
        showToast('Form cleared');
      });

      /* Submit */
      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const setup = {
          district:          document.getElementById('setupDistrict').value.trim(),
          mandal:            document.getElementById('setupMandal').value.trim(),
          schoolName:        document.getElementById('setupSchoolName').value.trim(),
          village:           document.getElementById('setupVillage').value.trim(),
          deoName:           document.getElementById('setupDeoName').value.trim(),
          mandalOfficerName: document.getElementById('setupMandalOfficer').value.trim(),
          principalName:     document.getElementById('setupPrincipalName').value.trim(),
          setupDate:         new Date().toISOString().slice(0, 10),
          language:          'en'
        };

        if (!setup.district || !setup.mandal || !setup.schoolName || !setup.village) {
          showToast('Please fill all required fields', 'error');
          return;
        }

        localStorage.setItem('ap_device_setup', JSON.stringify(setup));

        showToast('School details saved ✅');

        /* Generate + store secret code silently */
        const secret = generateSchoolSecret(setup);
        localStorage.setItem('ap_school_secret', secret);

        /* Go to activation */
        setTimeout(() => {
          window.location.href = './activation.html';
        }, 800);
      });
    });

    /* ── Secret code generator (matches Valiass formula) ── */
    function generateSchoolSecret(setup) {
      const last = (str) => (str && str.length ? str.trim().slice(-1).toLowerCase() : 'x');
      const letters =
        last(setup.mandal) +
        last(setup.schoolName) +
        last(setup.village) +
        last(setup.deoName) +
        last(setup.mandalOfficerName) +
        last(setup.principalName);
      return letters + '@533340';
    }
  </script>

</body>
</html>
