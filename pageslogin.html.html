<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>Login · AP Schools</title>

  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../style.css" />
</head>

<body>

  <!-- Background -->
  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
    <img src="../assets/emblem.png" class="bg-watermark" alt="" />
  </div>

  <!-- App -->
  <div class="app">
    <section class="screen screen-login">

      <!-- Top Area — School Identity -->
      <div class="login-topbar">
        <img
          src="../assets/emblem.png"
          alt="School Emblem"
          class="login-emblem"
        />
        <div class="login-school" id="loginSchoolName">AP Primary School</div>
        <div class="login-village" id="loginVillage">Dagguluru</div>
      </div>

      <!-- Body -->
      <div class="login-body">

        <!-- Hero -->
        <div class="login-hero">
          <div class="login-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 class="login-title">Enter Password</h1>
          <p class="login-sub">Use your login password to open the app</p>
        </div>

        <!-- Form Card -->
        <form class="login-card" id="loginForm" autocomplete="off" novalidate>

          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-field">
              <input
                type="password"
                class="form-input"
                id="loginPassword"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Show password">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Attempts bar -->
          <div class="activation-attempts" id="loginAttempts">
            <span class="attempts-dot" data-attempt="1"></span>
            <span class="attempts-dot" data-attempt="2"></span>
            <span class="attempts-dot" data-attempt="3"></span>
            <span class="attempts-text" id="loginAttemptsText">3 attempts left</span>
          </div>

          <!-- Error -->
          <p class="activation-error" id="loginError" hidden></p>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary btn-xl btn-block" id="btnLogin">
            <span>Open App</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>

        </form>

        <!-- Lockout Card (hidden by default) -->
        <div class="activation-lock" id="loginLockout" hidden>
          <div class="activation-lock-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <h3 class="activation-lock-title">Too Many Attempts</h3>
          <p class="activation-lock-sub">Please wait before trying again.</p>
          <div class="activation-lock-time">
            <span class="lock-label">Try again in</span>
            <span class="lock-countdown" id="loginCountdown">1:00</span>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="login-forgot">
          <button type="button" class="login-forgot-link" id="btnForgot">
            Forgot password?
          </button>
          <p class="login-forgot-text">Contact Team Valiass to reset</p>
          <div class="activation-help-actions">
            <a href="tel:+918985361991" class="btn btn-outline btn-help">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
              </svg>
              <span>Call</span>
            </a>
            <a href="https://wa.me/918985361991" target="_blank" rel="noopener" class="btn btn-whatsapp btn-help">
              <svg viewBox="0 0 32 32" width="16" height="16">
                <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
              </svg>
              <span>WhatsApp</span>
            </a>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <footer class="app-footer">
        <div class="footer-initiative">
          An initiative of <strong>@VALIASS</strong> team
        </div>
        <div class="footer-contacts">
          <a href="tel:+918985361991" class="footer-contact-btn footer-phone" aria-label="Call Valiass">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
            </svg>
          </a>
          <a href="https://wa.me/918985361991" class="footer-contact-btn footer-wa" target="_blank" rel="noopener" aria-label="WhatsApp Valiass">
            <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
              <path fill="#25D366" d="M16 .5C7.4.5.5 7.4.5 16c0 2.8.7 5.4 2 7.7L.5 31.5l8-2.1c2.2 1.2 4.8 1.9 7.5 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.5 16 .5z"/>
              <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
            </svg>
          </a>
        </div>
      </footer>

    </section>
  </div>

  <!-- Scripts -->
  <script src="../js/app.js"></script>
  <script>
    /* ══════════════════════════════════════════
       LOGIN LOGIC
    ══════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', () => {

      /* ── Fill school info in header ── */
      try {
        const setup = JSON.parse(localStorage.getItem('ap_device_setup') || 'null');
        if (setup) {
          document.getElementById('loginSchoolName').textContent = setup.schoolName || 'School';
          document.getElementById('loginVillage').textContent = setup.village || '';
        }
      } catch (e) {}

      const form        = document.getElementById('loginForm');
      const input       = document.getElementById('loginPassword');
      const errorEl     = document.getElementById('loginError');
      const btnLogin    = document.getElementById('btnLogin');
      const attemptsText = document.getElementById('loginAttemptsText');
      const attemptsDots = document.querySelectorAll('#loginAttempts .attempts-dot');
      const lockoutCard = document.getElementById('loginLockout');
      const countdown   = document.getElementById('loginCountdown');

      const MAX_ATTEMPTS = 3;
      const LOCK_SECONDS = 60;

      let attempts  = parseInt(localStorage.getItem('ap_login_attempts') || '0', 10);
      let lockUntil = parseInt(localStorage.getItem('ap_login_lockUntil') || '0', 10);

      /* ── Password visibility toggle ── */
      document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.dataset.target);
          if (!target) return;

          const show = target.type === 'password';
          target.type = show ? 'text' : 'password';

          btn.innerHTML = show
            ? `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                 <line x1="1" y1="1" x2="23" y2="23"/>
               </svg>`
            : `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                 <circle cx="12" cy="12" r="3"/>
               </svg>`;
        });
      });

      /* ── Lockout check on load ── */
      const now = Date.now();
      if (lockUntil > now) {
        startLockout(Math.ceil((lockUntil - now) / 1000));
      } else {
        if (lockUntil && lockUntil <= now) {
          attempts = 0;
          lockUntil = 0;
          localStorage.setItem('ap_login_attempts', '0');
          localStorage.setItem('ap_login_lockUntil', '0');
        }
        updateAttemptsUI();
      }

      /* ── Forgot password button ── */
      document.getElementById('btnForgot').addEventListener('click', () => {
        window.location.href = './forgot-password.html';
      });

      /* ── Submit ── */
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (lockUntil > Date.now()) return;

        const entered = input.value;
        if (!entered) {
          showError('Please enter your password');
          return;
        }

        const stored = localStorage.getItem('ap_login_password');
        if (!stored) {
          showError('Password not set — please reinstall app');
          return;
        }

        // Decode
        let expected = '';
        try {
          expected = decodeURIComponent(escape(atob(stored)));
        } catch (err) {
          showError('Storage corrupted');
          return;
        }

        if (entered === expected) {
          onSuccess();
        } else {
          onFailure();
        }
      });

      /* ── Success ── */
      function onSuccess() {
        sessionStorage.setItem('ap_logged_in', 'true');
        localStorage.setItem('ap_login_attempts', '0');
        localStorage.setItem('ap_login_lockUntil', '0');

        input.disabled = true;
        btnLogin.disabled = true;
        btnLogin.innerHTML = `
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span>Welcome</span>
        `;

        showToast('Login successful ✅');

        setTimeout(() => {
          window.location.href = './roles.html';
        }, 700);
      }

      /* ── Failure ── */
      function onFailure() {
        attempts++;
        localStorage.setItem('ap_login_attempts', String(attempts));

        const remaining = MAX_ATTEMPTS - attempts;

        if (remaining <= 0) {
          lockUntil = Date.now() + LOCK_SECONDS * 1000;
          localStorage.setItem('ap_login_lockUntil', String(lockUntil));
          startLockout(LOCK_SECONDS);
        } else {
          showError(`Incorrect password. ${remaining} attempt${remaining === 1 ? '' : 's'} left.`);
          updateAttemptsUI();
          input.select();
        }
      }

      /* ── UI ── */
      function updateAttemptsUI() {
        const remaining = MAX_ATTEMPTS - attempts;
        attemptsText.textContent = `${remaining} attempt${remaining === 1 ? '' : 's'} left`;
        attemptsDots.forEach((dot, idx) => {
          dot.classList.toggle('used', idx >= remaining);
        });
      }

      function startLockout(seconds) {
        document.querySelector('.login-card').style.display = 'none';
        lockoutCard.hidden = false;

        let remaining = seconds;
        renderCountdown(remaining);

        const interval = setInterval(() => {
          remaining--;
          renderCountdown(remaining);

          if (remaining <= 0) {
            clearInterval(interval);
            attempts = 0;
            lockUntil = 0;
            localStorage.setItem('ap_login_attempts', '0');
            localStorage.setItem('ap_login_lockUntil', '0');

            document.querySelector('.login-card').style.display = '';
            lockoutCard.hidden = true;
            input.value = '';
            input.disabled = false;
            btnLogin.disabled = false;
            hideError();
            updateAttemptsUI();
            input.focus();
          }
        }, 1000);
      }

      function renderCountdown(sec) {
        const m = Math.floor(sec / 60);
        const s = String(sec % 60).padStart(2, '0');
        countdown.textContent = `${m}:${s}`;
      }

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
        input.classList.add('input-error');
      }

      function hideError() {
        errorEl.hidden = true;
        input.classList.remove('input-error');
      }

      input.addEventListener('input', hideError);
      input.focus();
    });
  </script>

</body>
</html>
