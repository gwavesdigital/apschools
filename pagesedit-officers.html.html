<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7B3E" />
  <title>Edit Officers · AP Schools</title>

  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div class="background" aria-hidden="true">
    <div class="bg-glow bg-glow-green"></div>
    <div class="bg-glow bg-glow-gold"></div>
    <div class="bg-grid"></div>
    <img src="../assets/emblem.png" class="bg-watermark" alt="" />
  </div>

  <div class="app">
    <section class="screen screen-form">

      <header class="topbar">
        <a href="./settings.html" class="topbar-back" aria-label="Back">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </a>
        <div class="topbar-title">Edit Officers</div>
        <div class="topbar-spacer"></div>
      </header>

      <div class="setup-body">

        <div class="setup-intro">
          <div class="setup-intro-icon">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="setup-intro-text">
            <h2>Edit Officer Names</h2>
            <p>These names appear in every report footer.</p>
          </div>
        </div>

        <form class="setup-form" id="officersForm" autocomplete="off">

          <div class="form-section">
            <div class="form-section-head">
              <span class="form-section-dot"></span>
              <span class="form-section-label">Officers</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="editDeo">DEO Name</label>
              <input type="text" class="form-input" id="editDeo" placeholder="e.g. Sri. K. Ramakrishna" />
            </div>

            <div class="form-group">
              <label class="form-label" for="editMo">Mandal Officer Name</label>
              <input type="text" class="form-input" id="editMo" placeholder="e.g. Sri. P. Venkatesh" />
            </div>

            <div class="form-group">
              <label class="form-label" for="editPrincipal">Principal Name</label>
              <input type="text" class="form-input" id="editPrincipal" placeholder="e.g. Sri K. V. Rao" />
            </div>

            <p class="muted small" id="lastEdited"></p>
          </div>

          <div class="form-actions form-actions-stack">
            <button type="submit" class="btn btn-primary btn-xl btn-block">
              <span>Save Changes</span>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
            <a href="./settings.html" class="btn btn-outline btn-block">Cancel</a>
          </div>

        </form>

      </div>

      <footer class="app-footer">
        <div class="footer-initiative">
          An initiative of <strong>@VALIASS</strong> team
        </div>
        <div class="footer-contacts">
          <a href="tel:+918985361991" class="footer-contact-btn footer-phone" aria-label="Call Valiass">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/>
            </svg>
          </a>
          <a href="https://wa.me/918985361991" class="footer-contact-btn footer-wa" target="_blank" rel="noopener" aria-label="WhatsApp Valiass">
            <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
              <path fill="#25D366" d="M16 .5C7.4.5.5 7.4.5 16c0 2.8.7 5.4 2 7.7L.5 31.5l8-2.1c2.2 1.2 4.8 1.9 7.5 1.9 8.6 0 15.5-6.9 15.5-15.5S24.6.5 16 .5z"/>
              <path fill="#FFF" d="M23.9 19.2c-.4-.2-2.5-1.2-2.8-1.4-.4-.1-.6-.2-.9.2-.3.4-1 1.3-1.2 1.5-.2.2-.4.3-.8.1-.4-.2-1.7-.6-3.2-2-1.2-1-1.9-2.3-2.2-2.7-.2-.4 0-.6.2-.8.2-.2.4-.4.6-.7.2-.2.3-.4.4-.7.1-.3 0-.5 0-.7 0-.2-.9-2.2-1.2-3-.3-.8-.6-.7-.9-.7h-.8c-.3 0-.7.1-1.1.5-.4.4-1.4 1.4-1.4 3.4s1.5 3.9 1.7 4.2c.2.3 2.9 4.5 7.1 6.3 1 .4 1.8.7 2.4.9 1 .3 1.9.3 2.6.2.8-.1 2.5-1 2.8-2 .3-1 .3-1.9.2-2-.1-.2-.4-.3-.8-.5z"/>
            </svg>
          </a>
        </div>
      </footer>

    </section>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const s = JSON.parse(localStorage.getItem('ap_device_setup') || '{}');

      document.getElementById('editDeo').value = s.deoName || '';
      document.getElementById('editMo').value = s.mandalOfficerName || '';
      document.getElementById('editPrincipal').value = s.principalName || '';

      if (s.lastOfficerEdit) {
        document.getElementById('lastEdited').textContent = 'Last edited: ' + s.lastOfficerEdit;
      }

      document.getElementById('officersForm').addEventListener('submit', (e) => {
        e.preventDefault();
        s.deoName = document.getElementById('editDeo').value.trim();
        s.mandalOfficerName = document.getElementById('editMo').value.trim();
        s.principalName = document.getElementById('editPrincipal').value.trim();
        s.lastOfficerEdit = formatDateNice(todayISO()) + ' ' + formatTime12();

        localStorage.setItem('ap_device_setup', JSON.stringify(s));
        showToast('Officer names saved ✅');
        setTimeout(() => window.location.href = './settings.html', 700);
      });
    });
  </script>
</body>
</html>
